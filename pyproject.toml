[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "publishing-os"
version = "1.0.0"
description = "A Deterministic Protocol for Epistemic Integrity and Multi-Target Knowledge Compilation in the Generative AI Era"
readme = "README.md"
authors = [{ name = "Yuji Marutani", email = "info@ovalley.org" }]
license = { text = "CC-BY-4.0" }
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18.0",
    "networkx>=3.1",
    "weasyprint>=59.0"
]

[project.scripts]
publishing-os-verify = "src.kernel.verify:main"
publishing-os-build = "src.compiler.build:main"
